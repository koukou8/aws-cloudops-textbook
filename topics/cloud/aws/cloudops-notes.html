  <script>
    (async function () {
      const output = document.getElementById('markdown-output');
      const raw = document.getElementById('markdown-source');
      const toc = document.getElementById('notes-toc');
      const copyButton = document.getElementById('copy-markdown');
      const copyStatus = document.getElementById('copy-status');
      let source = '';

      try {
        const response = await fetch('./cloudops-notes.md', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        source = await response.text();
        output.innerHTML = renderMarkdown(source);
        output.setAttribute('aria-busy', 'false');
        raw.textContent = source;
        buildToc();
      } catch (error) {
        output.setAttribute('aria-busy', 'false');
        output.innerHTML = '<p class="text-slate-600">Markdownを読み込めませんでした。<a class="text-sky-700 underline" href="cloudops-notes.md">Markdownファイルを直接開く</a>ことができます。</p>';
        copyButton.disabled = true;
      }

      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(source);
          copyStatus.textContent = 'Markdownをコピーしました。';
        } catch (error) {
          copyStatus.textContent = 'コピーできませんでした。Markdown原文から選択してください。';
        }
      });

      function buildToc() {
        output.querySelectorAll('h2, h3').forEach(heading => {
          const link = document.createElement('a');
          link.href = `#${heading.id}`;
          link.className = `toc-link${heading.tagName === 'H3' ? ' is-sub' : ''}`;
          link.textContent = heading.textContent;
          toc.appendChild(link);
        });
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
        const html = [];
        const paragraph = [];
        let listItems = [];
        const usedIds = new Map();

        function flushParagraph() {
          if (!paragraph.length) return;
          html.push(`<p>${inline(paragraph.join(' '))}</p>`);
          paragraph.length = 0;
        }

        function flushList() {
          if (!listItems.length) return;
          const roots = [];
          const stack = [{ indent: -1, children: roots }];
          listItems.forEach(item => {
            while (stack.length > 1 && item.indent <= stack[stack.length - 1].indent) stack.pop();
            const node = { text: item.text, children: [] };
            stack[stack.length - 1].children.push(node);
            stack.push({ indent: item.indent, children: node.children });
          });
          html.push(renderList(roots));
          listItems = [];
        }

        function renderList(nodes) {
          return `<ul>${nodes.map(node => `<li>${inline(node.text)}${node.children.length ? renderList(node.children) : ''}</li>`).join('')}</ul>`;
        }

        function uniqueId(text) {
          const base = text.normalize('NFKC').toLowerCase()
            .replace(/[^\p{Letter}\p{Number}]+/gu, '-')
            .replace(/^-+|-+$/g, '') || 'section';
          const count = usedIds.get(base) || 0;
          usedIds.set(base, count + 1);
          return count ? `${base}-${count + 1}` : base;
        }

        lines.forEach(line => {
          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          const bullet = line.match(/^(\s*)-\s+(.+)$/);

          if (heading) {
            flushParagraph();
            flushList();
            const level = heading[1].length;
            const text = heading[2].trim();
            html.push(`<h${level} id="${uniqueId(text)}">${inline(text)}</h${level}>`);
          } else if (bullet) {
            flushParagraph();
            listItems.push({ indent: bullet[1].replace(/\t/g, '  ').length, text: bullet[2] });
          } else if (!line.trim()) {
            flushParagraph();
            flushList();
          } else {
            flushList();
            paragraph.push(line.trim());
          }
        });

        flushParagraph();
        flushList();
        return html.join('\n');
      }

      function inline(text) {
        const escaped = String(text).replace(/[&<>"']/g, character => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[character]));
        return escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      }
    })();
  </script>
